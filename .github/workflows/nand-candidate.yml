name: Experimental EN751221 NAND-format candidate

on:
  push:
    branches: [nand-image-candidate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget
      - name: Build experimental image
        run: |
          chmod +x build-nand-candidate.sh
          ./build-nand-candidate.sh
      - name: Upload candidate image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: en751221-nand-format-candidate
          path: candidate-output/*
          if-no-files-found: error
          retention-days: 30
