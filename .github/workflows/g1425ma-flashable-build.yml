name: G-1425-MA persistent flash image with Wi-Fi

on:
  push:
    branches:
      - g1425ma-flashable-wifi-experimental
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1425ma-flashable-wifi-experimental
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            python3-docutils python3-packaging rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler zstd xsltproc subversion time perl

      - name: Build persistent TCLinux image
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log

      - name: Show image and checksum
        if: always()
        shell: bash
        run: |
          find openwrt/bin/targets/econet/en751221 -maxdepth 1 -type f -name '*nokia_g240g-e*squashfs-tclinux.trx' -printf '%f %s bytes\n' 2>/dev/null || true
          sha256sum openwrt/bin/targets/econet/en751221/*nokia_g240g-e*squashfs-tclinux.trx 2>/dev/null || true

      - name: Upload persistent flash image and build log
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-g1425ma-flashable-wifi-experimental
          path: |
            openwrt/bin/targets/econet/en751221/*nokia_g240g-e-squashfs-tclinux.trx
            build.log
          if-no-files-found: error
          retention-days: 14
