name: G-1425-MA experimental RAM image

on:
  push:
    branches:
      - g1425ma-ram256-wifi-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            python3-docutils python3-packaging rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler zstd xsltproc subversion time perl

      - name: Build initramfs image
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log

      - name: Show generated images and checksums
        if: always()
        shell: bash
        run: |
          find openwrt/bin/targets/econet/en751221 -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          find openwrt/bin/targets/econet/en751221 -maxdepth 1 -type f -name '*initramfs-kernel.bin' -exec sha256sum {} \; 2>/dev/null || true

      - name: Upload RAM-boot image and build log
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-g1425ma-ram256-wifi-experimental
          path: |
            openwrt/bin/targets/econet/en751221/*initramfs-kernel.bin
            build.log
          if-no-files-found: error
          retention-days: 14
